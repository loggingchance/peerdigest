name: FBS Weekly Notes send-or-alert

on:
  workflow_dispatch:
  schedule:
    # Friday 5:23 AM America/New_York across EDT/EST.
    - cron: '23 9 * * 5'
    - cron: '23 10 * * 5'

permissions:
  contents: write

concurrency:
  group: fbs-weekly-notes-send
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DELIVERY_WORKFLOW: FBS Weekly Notes
      HANDOFF_PATH: data/handoffs/fbs_weekly.json
      DELIVERY_TIMEZONE: America/New_York
      EXPECTED_FROM: FBS Weekly Notes <no-reply@forestenterprise.org>
      EXPECTED_TO: steve@northeastforests.com
      ALERT_FROM: FBS Automation Monitor <no-reply@forestenterprise.org>
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve local slot
        id: slot
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo("America/New_York"))
          manual=os.environ.get("GITHUB_EVENT_NAME")=="workflow_dispatch"
          print("run=" + ("true" if manual or (now.weekday()==4 and now.hour==5 and now.minute>=20) else "false"))
          PY
      - name: Validate secret
        if: steps.slot.outputs.run == 'true'
        run: test -n "$RESEND_API_KEY"
      - name: Send or alert
        if: steps.slot.outputs.run == 'true'
        run: python scripts/send_single_handoff.py
      - name: Commit ledger
        if: always() && steps.slot.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/delivery-ledger
          if ! git diff --cached --quiet; then
            git commit -m "Record FBS Weekly Notes delivery"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
