name: Peer Group send-or-alert

on:
  workflow_dispatch:
  schedule:
    # Friday 7:53 AM America/Denver across MDT/MST. Local-time guard skips the other UTC slot.
    - cron: '53 13 * * 5'
    - cron: '53 14 * * 5'

permissions:
  contents: write

concurrency:
  group: peer-group-send-or-alert
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}\n      HEALTHCHECKS_URL: ${{ secrets.HC_PEER_GROUP }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve local send slot
        id: slot
        shell: python
        run: |
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/Denver"))
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          ok = manual or (now.weekday() == 4 and now.hour == 7 and now.minute >= 50)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("run=" + ("true" if ok else "false") + "\n")

      - name: Validate secret
        if: steps.slot.outputs.run == 'true'
        shell: bash
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::RESEND_API_KEY is not configured for this repository."
            exit 1
          fi

      - name: Send current issue or alert
        id: deliver
        if: steps.slot.outputs.run == 'true'
        run: python scripts/send_peer_digest.py

      - name: Commit delivery ledger
        if: always() && steps.slot.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/delivery-ledger
          if ! git diff --cached --quiet; then
            git commit -m "Record Peer Group delivery state"
            git push origin HEAD:main
          fi

      - name: Ping external monitor success
        if: success() && steps.slot.outputs.run == 'true' && env.HEALTHCHECKS_URL != ''
        run: curl -fsS --retry 3 --max-time 10 "$HEALTHCHECKS_URL"

      - name: Ping external monitor failure
        if: failure() && steps.slot.outputs.run == 'true' && env.HEALTHCHECKS_URL != ''
        run: curl -fsS --retry 3 --max-time 10 "$HEALTHCHECKS_URL/fail"
