name: Funding Opportunities send-or-alert

on:
  workflow_dispatch:
  schedule:
    # Tuesday 5:07 AM America/Denver across MDT/MST.
    - cron: '7 11 * * 2'
    - cron: '7 12 * * 2'

permissions:
  contents: write

concurrency:
  group: funding-opportunities-send
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}\n      HEALTHCHECKS_URL: ${{ secrets.HC_FUNDING }}
      DELIVERY_WORKFLOW: NF LLC Weekly Funding Opportunities
      HANDOFF_PATH: data/handoffs/funding.json
      DELIVERY_TIMEZONE: America/Denver
      EXPECTED_FROM: NF LLC Opportunities <no-reply@forestenterprise.org>
      EXPECTED_TO: steve@northeastforests.com
      ALERT_FROM: NF LLC Automation Monitor <no-reply@forestenterprise.org>
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve local slot
        id: slot
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo("America/Denver"))
          manual=os.environ.get("GITHUB_EVENT_NAME")=="workflow_dispatch"
          print("run=" + ("true" if manual or (now.weekday()==1 and now.hour==5 and now.minute>=5) else "false"))
          PY
      - name: Validate secret
        if: steps.slot.outputs.run == 'true'
        run: test -n "$RESEND_API_KEY"
      - name: Send or alert
        if: steps.slot.outputs.run == 'true'
        run: python scripts/send_single_handoff.py
      - name: Commit ledger
        if: always() && steps.slot.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/delivery-ledger
          if ! git diff --cached --quiet; then
            git commit -m "Record funding-opportunity delivery"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Ping external monitor success
        if: success() && steps.slot.outputs.run == 'true' && env.HEALTHCHECKS_URL != ''
        run: curl -fsS --retry 3 --max-time 10 "$HEALTHCHECKS_URL"

      - name: Ping external monitor failure
        if: failure() && steps.slot.outputs.run == 'true' && env.HEALTHCHECKS_URL != ''
        run: curl -fsS --retry 3 --max-time 10 "$HEALTHCHECKS_URL/fail"
